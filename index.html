<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOVA – Color Bends (CSS-Only)</title>
<style>
/* ===========================
   TUNING / THEME
   =========================== */
:root{
  /* Grundpalette (MOVA-ig): */
  --c1: #0ea5e9;   /* Cyan/Blau   */
  --c2: #7c3aed;   /* Violett     */
  --c3: #00e5a8;   /* Türkis/Grün */
  --c4: #ffd166;   /* Akzent warm */
  --c5: #ffffff;   /* Glanzpunkt  */

  /* Intensitäten & Filter: */
  --blur-clouds: 64px;
  --blur-bands:  18px;
  --sat: 1.30;
  --ctr: 1.06;
  --brightness: 1.02;

  /* Band-“Dichte” (Masken) */
  --band-gap: 11px;     /* Abstand zwischen Bändern */
  --band-soft: 14px;    /* Kantenweichheit          */

  /* Bewegungen (höher = schneller) */
  --speed-a: 22s;  /* große Wolken */
  --speed-b: 26s;  /* Bänder/Glanz */
  --speed-c: 38s;  /* subtile Drift */
}

/* Seite neutral halten – Hintergrund durchsichtig möglich */
html, body { height:100%; margin:0; background:#0b0b0b; }

/* ======= STAGE ======= */
#color-bends {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;       /* Blend-Modes sauber */
  filter:
    saturate(var(--sat))
    contrast(var(--ctr))
    brightness(var(--brightness));
  will-change: transform, filter;
}

/* ======= LAYER 1: Farbwolken (Basis, “Dye”) ======= */
#color-bends .clouds {
  position: absolute; inset: -15%;
  background:
    radial-gradient(72% 58% at 18% 18%, var(--c2) 0 46%, transparent 47%),
    radial-gradient(72% 58% at 85% 20%, var(--c1) 0 46%, transparent 47%),
    radial-gradient(72% 58% at 20% 83%, var(--c3) 0 46%, transparent 47%),
    radial-gradient(62% 48% at 82% 78%, var(--c4) 0 40%, transparent 41%),
    radial-gradient(52% 40% at 50% 50%, var(--c5) 0 18%, transparent 19%);
  filter: blur(var(--blur-clouds));
  mix-blend-mode: screen;
  animation: clouds-move var(--speed-a) linear infinite alternate;
  transform: translateZ(0);
}

/* ======= LAYER 2: “Bänder”-Färbung (conic) ======= */
#color-bends .bands-color {
  position: absolute; inset: -20%;
  /* Mehrere conic-gradients, überlagert – geben Farbwechsel entlang krummer Achsen */
  background:
    conic-gradient(from 12deg at 25% 40%, var(--c5) 0 6%, transparent 7% 100%),
    conic-gradient(from -26deg at 70% 65%, var(--c2) 0 18%, transparent 19% 100%),
    conic-gradient(from 55deg at 40% 70%, var(--c1) 0 14%, transparent 15% 100%),
    conic-gradient(from -70deg at 62% 30%, var(--c3) 0 12%, transparent 13% 100%);
  filter: blur(calc(var(--blur-bands) * .9));
  mix-blend-mode: color-dodge;
  opacity: .85;
  animation: bands-drift var(--speed-c) ease-in-out infinite alternate;
}

/* ======= LAYER 3: Maskierte Bänder (Highlight-Kanten) ======= */
/* Idee: Helle Glanzflächen werden mit einem wiederholten, weichen Maskenraster
   zu “Bändern” gestückelt. Dadurch entsteht der typische Color-Bends-Look. */
#color-bends .bands-mask {
  position: absolute; inset: -22%;
  background:
    radial-gradient(60% 80% at 65% 30%, rgba(255,255,255,.32), rgba(0,0,0,0) 65%),
    radial-gradient(60% 80% at 35% 75%, rgba(255,255,255,.26), rgba(0,0,0,0) 65%),
    conic-gradient(from 20deg at 30% 40%, rgba(255,255,255,.26), transparent 35%),
    conic-gradient(from -40deg at 70% 65%, rgba(255,255,255,.22), transparent 40%);
  filter: blur(var(--blur-bands));
  mix-blend-mode: overlay;

  /* Weich gestaffelte Streifen – wirken wie “gebogene” Bänder: */
  -webkit-mask-image:
    repeating-linear-gradient(
      115deg,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) calc(var(--band-gap) * .35),
      rgba(0,0,0,1) calc(var(--band-gap) * .35 + var(--band-soft)),
      rgba(0,0,0,1) calc(var(--band-gap) * 1.0)
    );
  mask-image:
    repeating-linear-gradient(
      115deg,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) calc(var(--band-gap) * .35),
      rgba(0,0,0,1) calc(var(--band-gap) * .35 + var(--band-soft)),
      rgba(0,0,0,1) calc(var(--band-gap) * 1.0)
    );
  animation: bands-flow var(--speed-b) ease-in-out infinite alternate;
}

/* ======= LAYER 4: Glanz & Vignette – tieferer Kontrast ======= */
#color-bends .gloss {
  position:absolute; inset:-10%;
  background:
    radial-gradient(160% 120% at 50% 50%, rgba(255,255,255,.06) 0 40%, rgba(0,0,0,.25) 100%),
    radial-gradient(120% 100% at 15% 20%, rgba(255,255,255,.12), transparent 60%),
    radial-gradient(120% 100% at 85% 80%, rgba(255,255,255,.10), transparent 60%);
  mix-blend-mode: soft-light;
  pointer-events:none;
}

/* ======= ANIMATIONEN ======= */
@keyframes clouds-move{
  0%   { transform: translate(-3%, -2%) rotate(0deg)   scale(1.05); }
  50%  { transform: translate( 4%,  3%) rotate(8deg)   scale(1.08); }
  100% { transform: translate(-2%,  5%) rotate(-6deg)  scale(1.03); }
}
@keyframes bands-drift{
  0%   { transform: translate(3%, 2%) rotate(-10deg) scale(1.08); }
  50%  { transform: translate(-4%,-3%) rotate(6deg)   scale(1.03); }
  100% { transform: translate(2%,-5%) rotate(12deg)   scale(1.06); }
}
@keyframes bands-flow{
  0%   { background-position: 0 0; transform: translate(2%, -2%) rotate(4deg) scale(1.06); }
  100% { background-position: 120px 90px; transform: translate(-3%, 3%) rotate(-6deg) scale(1.03); }
}

/* ======= Barrierefreiheit: Bewegungen reduzieren ======= */
@media (prefers-reduced-motion: reduce){
  #color-bends .clouds,
  #color-bends .bands-color,
  #color-bends .bands-mask { animation: none; }
}
</style>
</head>
<body>
  <div id="color-bends" aria-hidden="true">
    <div class="clouds"></div>
    <div class="bands-color"></div>
    <div class="bands-mask"></div>
    <div class="gloss"></div>
  </div>
</body>
</html>
