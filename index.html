<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOVA – Color Bends</title>
  <style>
    html, body { height:100%; margin:0; background:transparent; }
    #mova-bends-root { position:fixed; inset:0; overflow:hidden; background:transparent; }
  </style>
</head>
<body>
  <div id="mova-bends-root"></div>

  <!-- Drei CDNs, automatisch mit Fallback; Safari/CORS-freundlich -->
  <script>
  (function(){
    const CDNS = [
      "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.161.0/three.min.js",
      "https://unpkg.com/three@0.161.0/build/three.min.js"
    ];
    function load(src, ok, fail){
      const s = document.createElement("script");
      s.src = src; s.async = false;
      s.crossOrigin = "anonymous";
      s.referrerPolicy = "no-referrer";
      s.onload = ok; s.onerror = fail;
      document.head.appendChild(s);
    }
    (function tryNext(i){
      if (i >= CDNS.length) { document.body.innerHTML += "<p style='font:14px system-ui;padding:16px'>Konnte three.js nicht laden.</p>"; return; }
      load(CDNS[i], init, () => tryNext(i+1));
    })(0);

    function init(){
      const root = document.getElementById("mova-bends-root");
      if (!root || !window.THREE) return;

      const prefersReduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const PARAMS = {
        colors: ["#0ea5e9","#7c3aed","#00e5a8"],  // MOVA-Farben
        rotation: 30 * Math.PI/180,
        speed: 0.20, scale: 1.2, frequency: 1.4, warpStrength: 1.2,
        mouseInfluence: prefersReduced ? 0.0 : 0.8,
        parallax: prefersReduced ? 0.0 : 0.6,
        noiseAmount: 0.08, transparent: true
      };

      const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:PARAMS.transparent });
      renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
      renderer.setSize(innerWidth, innerHeight);
      root.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

      const MAX = 8;
      const frag = `
        precision highp float;
        uniform vec2  uResolution; uniform float uTime; uniform vec2 uMouse;
        uniform vec3  uColors[${MAX}]; uniform int uColorCount;
        uniform float uRotation,uSpeed,uScale,uFrequency,uWarpStrength,uParallax,uNoiseAmount;
        float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
        float n(vec2 p){ vec2 i=floor(p),f=fract(p);
          float a=h(i),b=h(i+vec2(1.,0.)),c=h(i+vec2(0.,1.)),d=h(i+vec2(1.,1.));
          vec2 u=f*f*(3.-2.*f);
          return mix(a,b,u.x)+(c-a)*u.y*(1.-u.x)+(d-b)*u.x*u.y; }
        float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ v+=a*n(p); p*=2.; a*=.5; } return v; }
        mat2 R(float a){ float s=sin(a), c=cos(a); return mat2(c,-s,s,c); }
        void main(){
          vec2 uv=(gl_FragCoord.xy-0.5*uResolution)/uResolution.y;
          uv += uParallax * uMouse * 0.1;
          uv = R(uRotation) * (uv * uScale);
          vec2 q = uv * uFrequency; float t = uTime * uSpeed;
          vec2 w = vec2(fbm(q+vec2(0.,t)), fbm(q+vec2(t,0.))); q += uWarpStrength*(w-.5);
          q.x += 0.12 * sin((uv.y*3.1415) + t*0.9);
          q.y += 0.12 * cos((uv.x*3.1415) - t*0.7);
          float m = fbm(q*1.2);
          m = mix(m, fbm(q*2.1 + 3.7), 0.35);
          m += uNoiseAmount * (n(q*4. + t*.5) - .5);
          vec3 col=vec3(0.0); float tot=0.0;
          for(int i=0;i<${MAX};i++){
            if(i>=uColorCount) break;
            float fi=float(i);
            float wgt = smoothstep(0.,1., 1. - abs(m - (fi/float(max(uColorCount-1,1))))*1.6);
            col += uColors[i]*wgt; tot += wgt;
          }
          col /= max(tot,1e-3);
          col *= 1. - 0.25 * smoothstep(0.6, 1.2, length(uv));
          gl_FragColor = vec4(col, 0.999);
        }`;
      const vert = `precision highp float; attribute vec3 position; void main(){ gl_Position=vec4(position,1.0);} `;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]),3));

      const uniforms = {
        uResolution:{ value:new THREE.Vector2(innerWidth, innerHeight) },
        uTime:{ value:0 }, uMouse:{ value:new THREE.Vector2(0,0) },
        uColors:{ value:new Array(MAX).fill(0).map(()=> new THREE.Color(0x000000)) },
        uColorCount:{ value:3 },
        uRotation:{ value:PARAMS.rotation }, uSpeed:{ value:PARAMS.speed }, uScale:{ value:PARAMS.scale },
        uFrequency:{ value:PARAMS.frequency }, uWarpStrength:{ value:PARAMS.warpStrength },
        uParallax:{ value:PARAMS.parallax }, uNoiseAmount:{ value:PARAMS.noiseAmount }
      };
      ["#0ea5e9","#7c3aed","#00e5a8"].forEach((hex,i)=> uniforms.uColors.value[i]=new THREE.Color(hex));

      const mat = new THREE.ShaderMaterial({ vertexShader:vert, fragmentShader:frag, uniforms, transparent:PARAMS.transparent });
      scene.add(new THREE.Mesh(geom, mat));

      addEventListener("resize", ()=>{ renderer.setSize(innerWidth, innerHeight, false); uniforms.uResolution.value.set(innerWidth, innerHeight); }, {passive:true});

      addEventListener("pointermove", (e)=>{ if (prefersReduced) return;
        const x=(e.clientX/innerWidth)*2-1, y=(e.clientY/innerHeight)*2-1;
        uniforms.uMouse.value.lerp(new THREE.Vector2(x,-y).multiplyScalar(PARAMS.mouseInfluence), 0.15);
      }, {passive:true});

      let start = performance.now();
      (function loop(now){ uniforms.uTime.value=(now-start)*0.001; renderer.render(scene,camera); requestAnimationFrame(loop); })(start);
    }
  })();
  </script>
</body>
</html>
