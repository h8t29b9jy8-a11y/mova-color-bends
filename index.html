<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOVA – Color Bends (Shader, lokal)</title>
  <style>
    html, body { height:100%; margin:0; background:#000; }
    canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <!-- WICHTIG: diese Datei liegt bei dir im Repo-Root -->
  <script src="three.min.js"></script>
  <script>
  (() => {
    // --------- Parameter (ähnlich ReactBits-Props) ----------
    const PARAMS = {
      colors: ['#0ea5e9', '#7c3aed', '#00e5a8'], // MOVA Palette
      rotation: 30 * Math.PI/180,
      speed: 0.20,
      scale: 1.2,
      frequency: 1.4,
      warpStrength: 1.2,
      mouseInfluence: 0.8,
      parallax: 0.6,
      noiseAmount: 0.08,
      transparent: true
    };

    // Bewegt sich weniger, falls Nutzer das System-Setting "Bewegung reduzieren" hat:
    const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      PARAMS.mouseInfluence = 0.0;
      PARAMS.parallax = 0.0;
      PARAMS.speed *= 0.4;
    }

    // --------- Three.js Setup ----------
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:PARAMS.transparent });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // Vollbild-Quad
    const geom = new THREE.BufferGeometry();
    // Dreieckstrippe für ein Fullscreen Quad (2 Dreiecke)
    const verts = new Float32Array([
      -1,-1,0,  3,-1,0,  -1,3,0
    ]);
    geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));

    const MAX_COLORS = 8;

    // --------- Shader ----------
    const vert = /* glsl */`
      precision highp float;
      attribute vec3 position;
      void main(){
        gl_Position = vec4(position, 1.0);
      }
    `;

    // Fragment-Shader mit FBM-Noise, Warping, conic-artigen Biegungen,
    // sanfter Farbmischung über mehrere Stops (nahe am ReactBits-Eindruck).
    const frag = /* glsl */`
      precision highp float;

      uniform vec2  uResolution;
      uniform float uTime;
      uniform vec2  uMouse;
      uniform vec3  uColors[${MAX_COLORS}];
      uniform int   uColorCount;

      uniform float uRotation;
      uniform float uSpeed;
      uniform float uScale;
      uniform float uFrequency;
      uniform float uWarpStrength;
      uniform float uParallax;
      uniform float uNoiseAmount;

      // Hash & Noise
      float hash(vec2 p){ return fract(1e4 * sin(17.0 * p.x + 0.1 * p.y) * (0.1 + abs(sin(13.0 * p.y + p.x)))); }
      float noise(vec2 x){
        vec2 i = floor(x), f = fract(x);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        vec2 u = f * f * (3.0 - 2.0*f);
        return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
      }
      float fbm(vec2 p){
        float v = 0.0;
        float a = 0.5;
        for(int i=0;i<5;i++){
          v += a * noise(p);
          p *= 2.0;
          a *= 0.5;
        }
        return v;
      }

      mat2 rot(float a){
        float s = sin(a), c = cos(a);
        return mat2(c,-s,s,c);
      }

      void main(){
        // Normierte Pixelkoordinaten, zentriert
        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;

        // leichter Parallax mit Maus
        uv += uParallax * uMouse * 0.1;

        // skalieren & rotieren
        uv = rot(uRotation) * (uv * uScale);

        // Basis-Noise-Koordinaten
        vec2 q = uv * uFrequency;
        float t = uTime * uSpeed;

        // "Bending": konische Krümmung durch sinus/cos über Achsen + Warping
        vec2 warp = vec2(fbm(q + vec2(0.0, t)), fbm(q + vec2(t, 0.0)));
        q += uWarpStrength * (warp - 0.5);

        // leichte Biegung/Bevel anlegen (ähnlich "color bends")
        q.x += 0.12 * sin((uv.y * 3.14159) + t * 0.9);
        q.y += 0.12 * cos((uv.x * 3.14159) - t * 0.7);

        // finaler Noise-Mix
        float m = fbm(q * 1.2);
        m = mix(m, fbm(q * 2.1 + 3.7), 0.35);
        m += uNoiseAmount * (noise(q * 4.0 + t * 0.5) - 0.5);

        // Mehrfarbige Mischung über uColors – weiche "Bänder"
        vec3 col = vec3(0.0);
        float tot = 0.0;
        for(int i=0; i<${MAX_COLORS}; i++){
          if(i >= uColorCount) break;
          float fi = float(i);
          // Position des i-ten Bandes
          float pos = fi / max(float(uColorCount - 1), 1.0);
          float w = smoothstep(0.0, 1.0, 1.0 - abs(m - pos) * 1.6);
          col += uColors[i] * w;
          tot += w;
        }
        col /= max(tot, 1e-3);

        // Vignette und leichter "gloss"
        float vign = smoothstep(1.2, 0.4, length(uv));
        col *= mix(0.85, 1.0, vign);
        col += 0.08 * vec3(smoothstep(0.35, 0.0, abs(m - 0.5))); // sanfter Glanz

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    // Uniforms
    const uniforms = {
      uResolution:   { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uTime:         { value: 0 },
      uMouse:        { value: new THREE.Vector2(0, 0) },
      uColors:       { value: new Array(MAX_COLORS).fill(0).map(()=> new THREE.Color(0x000000)) },
      uColorCount:   { value: Math.min(PARAMS.colors.length, MAX_COLORS) },
      uRotation:     { value: PARAMS.rotation },
      uSpeed:        { value: PARAMS.speed },
      uScale:        { value: PARAMS.scale },
      uFrequency:    { value: PARAMS.frequency },
      uWarpStrength: { value: PARAMS.warpStrength },
      uParallax:     { value: PARAMS.parallax },
      uNoiseAmount:  { value: PARAMS.noiseAmount }
    };

    // Palette setzen
    PARAMS.colors.slice(0, MAX_COLORS).forEach((hex, i) => {
      uniforms.uColors.value[i] = new THREE.Color(hex);
    });

    const material = new THREE.ShaderMaterial({
      vertexShader:   vert,
      fragmentShader: frag,
      uniforms,
      transparent: PARAMS.transparent
    });

    const mesh = new THREE.Mesh(geom, material);
    scene.add(mesh);

    // Resize
    const onResize = () => {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    };
    window.addEventListener('resize', onResize, { passive:true });
    onResize();

    // Maus/Touch für Parallax
    const onPointerMove = (e) => {
      if (prefersReduced) return;
      const x = (e.clientX / window.innerWidth)  * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      // sanftes Nachlaufen
      uniforms.uMouse.value.lerp(new THREE.Vector2(x, -y).multiplyScalar(PARAMS.mouseInfluence), 0.15);
    };
    window.addEventListener('pointermove', onPointerMove, { passive:true });

    // Loop
    let start = performance.now();
    const tick = (now) => {
      uniforms.uTime.value = (now - start) * 0.001;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
