<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOVA Media – Color Bends CSS v2</title>
<style>
html,body{height:100%;margin:0;background:#050505;}
body{overflow:hidden;display:flex;align-items:center;justify-content:center;}
#bends{
  position:fixed;inset:0;overflow:hidden;
  background:#050505;
  isolation:isolate;
  filter:saturate(1.25) contrast(1.05) brightness(1.1);
}

/* =========================
   Haupt-Layer
   ========================= */
#bends::before{
  content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(80% 80% at 30% 30%, #3cf 0%, transparent 70%),
    radial-gradient(80% 80% at 70% 40%, #8f3cff 0%, transparent 70%),
    radial-gradient(80% 80% at 40% 80%, #00e5a8 0%, transparent 70%),
    radial-gradient(80% 80% at 70% 75%, #ffd166 0%, transparent 80%);
  mix-blend-mode:screen;
  filter:blur(100px);
  animation:warp 25s ease-in-out infinite alternate;
  opacity:.9;
}

#bends::after{
  content:"";position:absolute;inset:-10%;
  background:
    conic-gradient(from 45deg at 50% 50%,rgba(255,255,255,.35) 0 12%,transparent 13% 25%,rgba(255,255,255,.2) 26% 38%,transparent 39% 51%,rgba(255,255,255,.3) 52% 63%,transparent 64% 100%);
  mix-blend-mode:overlay;
  filter:blur(25px) brightness(1.3);
  animation:shine 18s linear infinite;
  opacity:.8;
}

/* =========================
   Bewegungsebenen
   ========================= */
@keyframes warp{
  0%{transform:translate(-6%,-3%) scale(1.05) rotate(0deg);}
  25%{transform:translate(3%,5%) scale(1.1) rotate(15deg);}
  50%{transform:translate(-4%,3%) scale(1.06) rotate(-10deg);}
  75%{transform:translate(2%,-4%) scale(1.08) rotate(5deg);}
  100%{transform:translate(0%,0%) scale(1.04) rotate(-8deg);}
}

@keyframes shine{
  0%{transform:rotate(0deg) scale(1);}
  100%{transform:rotate(360deg) scale(1.1);}
}

/* =========================
   Extra-Licht-Effekt (Glanz)
   ========================= */
.gloss{
  position:absolute;inset:-5%;
  background:
    radial-gradient(150% 100% at 50% 50%,rgba(255,255,255,.05) 0,rgba(0,0,0,.35) 90%);
  mix-blend-mode:soft-light;
  pointer-events:none;
}

/* =========================
   Barrierefreiheit
   ========================= */
@media (prefers-reduced-motion: reduce){
  #bends::before,#bends::after{animation:none;}
}
</style>
</head>
<body>
  <div id="bends"></div>
  <div class="gloss"></div>
</body>
</html>
