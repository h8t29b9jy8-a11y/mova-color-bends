<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOVA – Color Bends</title>
  <style>
    html, body { height:100%; margin:0; background:transparent; }
    #mova-bends-root { position:fixed; inset:0; overflow:hidden; background:transparent; }
    /* Barrierearmut: weniger Bewegung => Parallax/Mouse wird intern deaktiviert */
    @media (prefers-reduced-motion: reduce){
      #mova-bends-root { filter: saturate(1.05) contrast(1.05); }
    }
    /* Fallback, falls WebGL nicht verfügbar ist */
    .no-webgl {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(120% 80% at 0% 0%, #6ee7ff 0 45%, transparent 46%),
                  radial-gradient(120% 80% at 100% 0%, #7c3aed 0 45%, transparent 46%),
                  radial-gradient(120% 80% at 0% 100%, #10b981 0 45%, transparent 46%),
                  radial-gradient(120% 80% at 100% 100%, #f59e0b 0 45%, transparent 46%);
      filter: blur(36px) saturate(1.25) contrast(1.08);
    }
  </style>
</head>
<body>
  <div id="mova-bends-root">
    <noscript><div class="no-webgl"></div></noscript>
  </div>

  <!-- Three.js (CDN, HTTPS) -->
  <script src="https://unpkg.com/three@0.161.0/build/three.min.js" defer></script>

  <script>
  (function(){
    // Warten bis Three geladen ist
    function ready(cb){ if (window.THREE) cb(); else document.addEventListener('readystatechange',()=>{if(window.THREE) cb();}); }
    ready(function(){
      const mount = document.getElementById('mova-bends-root');
      if (!mount) return;

      // WebGL-Fähigkeit prüfen
      try {
        const test = document.createElement('canvas').getContext('webgl') || document.createElement('canvas').getContext('experimental-webgl');
        if(!test) throw 0;
      } catch(e) {
        mount.innerHTML = '<div class="no-webgl"></div>';
        return;
      }

      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // --- Parameter (wie reactbits) ---
      const PARAMS = {
        colors: ['#ff5c7a', '#88a5ff', '#00ffd1'], // du kannst hier deine MOVA-Farben setzen
        rotation: 30 * Math.PI/180,
        speed: 0.20,
        scale: 1.2,
        frequency: 1.4,
        warpStrength: 1.2,
        mouseInfluence: prefersReduced ? 0.0 : 0.8,
        parallax: prefersReduced ? 0.0 : 0.6,
        noiseAmount: 0.08,
        transparent: true
      };

      // --- Renderer/Scene/Camera ---
      const renderer = new THREE.WebGLRenderer({ antialias:true, alpha: PARAMS.transparent, powerPreference:'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      mount.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

      // --- Shader ---
      const MAX_COLORS = 8;
      const fragmentShader = `
        precision highp float;
        uniform vec2  uResolution;
        uniform float uTime;
        uniform vec2  uMouse;
        uniform vec3  uColors[${MAX_COLORS}];
        uniform int   uColorCount;
        uniform float uRotation,uSpeed,uScale,uFrequency,uWarpStrength,uMouseInfluence,uParallax,uNoiseAmount;

        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
        float noise(vec2 p){
          vec2 i=floor(p), f=fract(p);
          float a=hash(i), b=hash(i+vec2(1.,0.)), c=hash(i+vec2(0.,1.)), d=hash(i+vec2(1.,1.));
          vec2 u=f*f*(3.-2.*f);
          return mix(a,b,u.x) + (c-a)*u.y*(1.-u.x) + (d-b)*u.x*u.y;
        }
        float fbm(vec2 p){
          float v=0., a=.5;
          for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.; a*=.5; }
          return v;
        }
        mat2 rot(float a){ float s=sin(a), c=cos(a); return mat2(c,-s,s,c); }

        void main(){
          vec2 uv = (gl_FragCoord.xy - 0.5*uResolution) / uResolution.y;

          // Parallax über Maus
          uv += uParallax * uMouse * 0.1;

          // drehen & skalieren
          uv = rot(uRotation) * (uv * uScale);

          // Domain warp
          vec2 q = uv * uFrequency;
          float t = uTime * uSpeed;
          vec2 w = vec2( fbm(q + vec2(0.,t)), fbm(q + vec2(t,0.)) );
          q += uWarpStrength * (w - 0.5);

          // sanfte Sinus-Biegungen
          q.x += 0.12 * sin((uv.y*3.1415) + t*0.9);
          q.y += 0.12 * cos((uv.x*3.1415) - t*0.7);

          // Farbverteilung
          float n = fbm(q*1.2);
          n = mix(n, fbm(q*2.1 + 3.7), 0.35);
          n += uNoiseAmount * (noise(q*4. + t*.5) - .5);

          vec3 col = vec3(0.0);
          float tot = 0.0;
          for(int i=0;i<${MAX_COLORS};i++){
            if(i>=uColorCount) break;
            float fi = float(i);
            float wgt = smoothstep(0.,1., 1.0 - abs(n - (fi/float(max(uColorCount-1,1))))*1.6);
            col += uColors[i] * wgt;
            tot += wgt;
          }
          col /= max(tot, 1e-3);
          float r = length(uv);
          col *= 1.0 - 0.25 * smoothstep(0.6, 1.2, r);

          gl_FragColor = vec4(col, ${ (true ? '0.999' : '1.0') });
        }
      `;
      const vertexShader = `precision highp float; attribute vec3 position; void main(){ gl_Position=vec4(position,1.0); }`;

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position',
        new THREE.BufferAttribute(new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]),3)
      );

      const uniforms = {
        uResolution:     { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uTime:           { value: 0 },
        uMouse:          { value: new THREE.Vector2(0,0) },
        uColors:         { value: new Array(MAX_COLORS).fill(0).map(()=> new THREE.Color(0x000000)) },
        uColorCount:     { value: Math.min(PARAMS.colors.length, MAX_COLORS) },
        uRotation:       { value: PARAMS.rotation },
        uSpeed:          { value: PARAMS.speed },
        uScale:          { value: PARAMS.scale },
        uFrequency:      { value: PARAMS.frequency },
        uWarpStrength:   { value: PARAMS.warpStrength },
        uMouseInfluence: { value: PARAMS.mouseInfluence },
        uParallax:       { value: PARAMS.parallax },
        uNoiseAmount:    { value: PARAMS.noiseAmount }
      };
      PARAMS.colors.slice(0, MAX_COLORS).forEach((hex,i)=> uniforms.uColors.value[i] = new THREE.Color(hex));

      const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms, transparent: PARAMS.transparent });
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // Resize
      function resize(){
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        uniforms.uResolution.value.set(w, h);
      }
      window.addEventListener('resize', resize, {passive:true}); resize();

      // Maus/Parallax
      function onPointerMove(e){
        if (prefersReduced) return;
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = (e.clientY / window.innerHeight) * 2 - 1;
        uniforms.uMouse.value.lerp(new THREE.Vector2(x, -y).multiplyScalar(PARAMS.mouseInfluence), 0.15);
      }
      window.addEventListener('pointermove', onPointerMove, {passive:true});

      // Loop
      let start = performance.now();
      function tick(now){
        uniforms.uTime.value = (now - start) * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  })();
  </script>
</body>
</html>
